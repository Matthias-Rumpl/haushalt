<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haushalt</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Haushalt">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fdf6e3">
<style>
  html, body { margin: 0; min-height: 100%; background: #fdf6e3; color: #2b2118; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .lade { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px; box-sizing: border-box; }
  .lade img { width: 128px; height: 128px; border-radius: 28px; box-shadow: 4px 4px 0 #2b2118; border: 2.5px solid #2b2118; animation: hops 1.1s ease-in-out infinite; }
  .lade p { margin: 18px 0 0; font-weight: 600; }
  .lade small { display: block; margin-top: 8px; opacity: .7; }
  .lade button { margin-top: 16px; padding: 10px 18px; border-radius: 12px; border: 2px solid #2b2118; background: #ffc93c; font-weight: 700; font-size: 15px; box-shadow: 3px 3px 0 #2b2118; }
  @keyframes hops { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-12px); } }
  html.dunkel, html.dunkel body { background: #1d2232; color: #f5eedc; }
</style>
<script>
// Startbildschirm gleich in der Farbe, die die App zuletzt hatte (hell/dunkel)
try { if (localStorage.getItem('hx-dunkel') === '1') { document.documentElement.classList.add('dunkel'); document.querySelector('meta[name=theme-color]').setAttribute('content', '#1d2232'); } } catch (e) {}
</script>
</head>
<body>
<div class="lade"><div><img src="icon-192.png" alt=""><p id="t">Määh – die App startet …</p><small id="s"></small></div></div>
<script>
// ===== Einstellungen =====
// Link der Google-Web-App (endet auf /exec). Dieselbe Adresse, die ihr bisher im Browser geöffnet habt.
const API = 'https://script.google.com/macros/s/AKfycbzovDaTJPWxnOmERzJQUZRyKFjq1Bvh7HPMgQc_O2MnZ1Zh8QNH9lUAo1v4HYzmeMw4sw/exec';
// ==========================

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

// Ersatz für google.script.run: dieselben Aufrufe, aber über die Schnittstelle (doPost) des Google Scripts
const SHIM = '(' + function (API) {
  const ruf = (fn, args) => fetch(API, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) })
    .then((r) => { if (!r.ok) throw new Error('NetworkError: HTTP ' + r.status); return r.json(); });
  const kette = (ok, err) => new Proxy({}, {
    get(_, name) {
      if (name === 'withSuccessHandler') return (f) => kette(f, err);
      if (name === 'withFailureHandler') return (g) => kette(ok, g);
      if (name === 'withUserObject') return () => kette(ok, err);
      return (...args) => {
        ruf(String(name), args)
          .then((j) => { if (j && j.ok) { if (ok) ok(j.r); } else if (err) err(new Error((j && j.fehler) || 'Fehler')); })
          .catch((e) => { if (err) err(new Error('NetworkError: ' + ((e && e.message) || 'keine Verbindung'))); });
      };
    }
  });
  window.google = { script: { run: kette(null, null) } };
  window.HX_APP = true;
} + ')(' + JSON.stringify(API) + ');';

const KOPF = '<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-32.png">' +
  '<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Haushalt">' +
  '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><script>' + SHIM + '<\/script>';

function zeige(html) {
  // Erst wenn diese Seite fertig geladen ist – sonst hängt document.write die App UNTER den Ladebildschirm an
  if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', () => zeige(html), { once: true }); return; }
  html = html.replace('<?!= daten ?>', 'null');
  html = /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, (m) => m + KOPF) : KOPF + html;
  document.open(); document.write(html); document.close();
}
// Seite holen – mit Prüfsumme: kommt nur, wenn es eine neue Version gibt (sonst {gleich:true})
function seiteHolen(hash, ms) {
  const ctl = window.AbortController ? new AbortController() : null;
  const uhr = ctl && ms ? setTimeout(() => ctl.abort(), ms) : null;
  return fetch(API, { method: 'POST', redirect: 'follow', cache: 'no-store', signal: ctl ? ctl.signal : undefined, headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: 'seite', args: [hash || ''] }) })
    .then((r) => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .catch((e) => { throw new Error(e && e.name === 'AbortError' ? 'Keine Antwort vom Server (nach ' + Math.round(ms / 1000) + ' s)' : ((e && e.message) || 'Keine Verbindung')); })
    .finally(() => { if (uhr) clearTimeout(uhr); }).then((j) => { if (!j.ok) throw new Error(j.fehler || 'Fehler'); return typeof j.r === 'string' ? { html: j.r, hash: '' } : j.r; });
}
const merk = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
function zeigeMit(html, hash) { try { sessionStorage.setItem('hx-seite-lief', hash || ''); } catch (e) {} zeige(html); }
function fehler(t) {
  document.getElementById('t').textContent = '✕ ' + t;
  document.getElementById('s').innerHTML = 'Ist das Handy online? Sonst WLAN/mobile Daten wechseln.<br><button onclick="location.reload()">Nochmal versuchen</button> <button onclick="location.href=API">Direkt öffnen</button>';
}
(async function start() {
  if (/HIER_DEN/.test(API)) return fehler('Der Link zur Web-App fehlt noch in index.html.');
  let alt = null, altHash = ''; try { alt = localStorage.getItem('hx-seite'); altHash = localStorage.getItem('hx-seite-hash') || ''; } catch (e) {}
  if (!alt) {
    let r = null, letzt = '';
    for (const [ms, txt] of [[20000, ''], [30000, 'Dauert länger als sonst – zweiter Versuch …']]) {
      if (txt) document.getElementById('s').textContent = txt;
      try { r = await seiteHolen('', ms); break; } catch (e) { letzt = (e && e.message) || 'Keine Verbindung'; }
    }
    if (!r || !r.html) return fehler(letzt || 'Keine Verbindung');
    merk('hx-seite', r.html); merk('hx-seite-hash', r.hash || ''); zeigeMit(r.html, r.hash);
    return;
  }
  // Gespeicherte Version sofort zeigen – eine neue wird im Hintergrund geholt und beim nächsten Start benutzt
  const neu = seiteHolen(altHash, 60000);
  zeigeMit(alt, altHash);
  neu.then((r) => { if (r && !r.gleich && r.html) { merk('hx-seite', r.html); merk('hx-seite-hash', r.hash || ''); } }).catch(() => {});
})();
</script>
</body>
</html>
